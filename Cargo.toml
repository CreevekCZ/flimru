[package]
name = "flimru"
version = "0.1.0"
edition = "2024"
description = "A persistent terminal launcher for Flutter and VS Code launch configurations"
license = "MIT"
repository = "https://github.com/CreevekCZ/flimru"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
jsonc-parser = { version = "0.32", features = ["serde"] }
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vt100 = "0.16"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"

[target.'cfg(unix)'.dependencies]
# The default mio reader loops indefinitely on a hung-up PTY in 0.29.
# This backend respects poll deadlines; our loop also checks terminal health.
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
disallowed_methods = "deny"

[profile.release]
lto = "thin"
strip = true
